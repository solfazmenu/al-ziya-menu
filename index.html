<!doctype html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Al Ziya Fathima: menu update</title>
<style>
:root{color-scheme:light dark;--bg:#FBF9F8;--ink:#1C1614;--muted:#6B5F5C;--red:#A31621;--on-red:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--ink:#F5EFEA;--muted:#B8ADA7}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;padding:24px;text-align:center}
.card{max-width:420px}
.mast{background:var(--red);color:var(--on-red);font:700 24px Georgia,"Times New Roman",serif;padding:16px 20px;border-radius:12px}
h1{font:700 22px Georgia,"Times New Roman",serif;margin:24px 0 8px}
p{margin:6px 0;line-height:1.5}
.muted{color:var(--muted);font-size:14px}
.tag{margin-top:28px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="mast">Al Ziya Fathima</div>
  <h1>Our menu is being updated</h1>
  <p>Kami sedang mengemas kini menu. Sila cuba lagi sebentar lagi.</p>
  <p class="muted">We will be back in a few minutes.</p>
  <p class="tag">Test page 14 Nov 2026 &middot; MT-1114</p>
</main>
</body>
</html>
