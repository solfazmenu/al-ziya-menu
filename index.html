<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Ziya Fathima Menu</title>
  <meta name="description" content="Al Ziya Fathima digital menu. Browse categories, search items and view prices in RM.">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img src="images/logo.png" alt="" class="header-logo" width="40" height="40">
      <span class="brand-name">Al Ziya Fathima</span>
    </div>
  </header>

  <div class="sticky-zone">
    <div class="search-row">
      <div class="search-wrap">
        <input type="search" id="search" class="search-input" placeholder="Search menu…" aria-label="Search menu" autocomplete="off">
        <button type="button" id="clear-search" class="clear-btn" aria-label="Clear search" hidden>&#10005;</button>
      </div>
      <button type="button" id="filter-open" class="filter-btn" aria-label="Filters" aria-haspopup="dialog" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
          <circle cx="15" cy="7" r="2.2"/>
          <circle cx="9" cy="17" r="2.2"/>
        </svg>
        <span class="filter-dot" id="filter-dot" aria-hidden="true" hidden></span>
      </button>
    </div>
    <button type="button" class="filter-chip" id="filter-chip" aria-label="Clear price limit" hidden>
      <span id="filter-chip-text">Up to RM 0.00</span>
      <span class="filter-chip-x" aria-hidden="true">&#10005;</span>
    </button>
  </div>

  <main id="main">
    <h1 class="visually-hidden">Al Ziya Fathima Menu</h1>
    <div id="view-state"></div>
    <div class="menu-layout no-rail" id="menu-layout">
      <nav class="rail" id="rail" aria-label="Categories" hidden></nav>
      <div id="grid" class="menu-list"></div>
    </div>
  </main>

  <dialog id="filter-dialog" class="filter-dialog" aria-labelledby="filter-title">
    <div class="filter-sheet">
      <div class="filter-head">
        <h2 class="filter-title" id="filter-title">Filter by price</h2>
        <button type="button" class="filter-close" id="filter-close" aria-label="Close filters">&#10005;</button>
      </div>
      <div class="price-filter" role="group" aria-label="Maximum price">
        <label class="price-value" id="price-value" for="price-range">Any price</label>
        <div class="price-range-wrap" id="price-range-wrap">
          <span class="price-range-track" aria-hidden="true"></span>
          <span class="price-range-fill" aria-hidden="true"></span>
          <input type="range" id="price-range" class="price-range" min="0" max="1" step="0.5" value="1" aria-label="Maximum price">
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="filter-reset" id="filter-reset">Reset</button>
        <button type="button" class="filter-show" id="filter-show">Show items</button>
      </div>
    </div>
  </dialog>

  <!-- SLOT: footer. Intentionally empty: no address, opening hours, phone or links have been supplied by the owner. Add the markup and the text together, only from real facts. -->
  <!-- SLOT: social links. Removed at the owner's request; hold them inside the footer, not the mast, when real URLs exist. -->

  <script src="app.js" defer></script>
</body>
</html>
